<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maincraft Gradient</title>
    <style>
        /* Базові налаштування фону та шрифту */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a; /* Темний однотонний фон */
            font-family: Arial, sans-serif;
            color: white;
        }

        /* Стиль заголовка з градієнтом */
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            /* Градієнт на тексті */
            background: linear-gradient(90deg, #55ff55, #55ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        /* Стиль кнопки */
        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: 2px solid #55ff55;
            border-radius: 5px;
            text-decoration: none;
            transition: background 0.3s;
        }

        /* Ефект при наведенні на кнопку */
        .btn:hover {
            background-color: #55ff55;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Maincraft Gradient 1.16+</h1>
    
    <a href="g.html" class="btn">Зайти</a>

</body>
</html>
