<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maincraft Gradient</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212; /* Темний фон */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 30px;
            /* Градієнт: білий -> фіолетовий -> білий */
            background: linear-gradient(90deg, #ffffff 0%, #a020f0 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            font-weight: bold;
        }

        .btn {
            padding: 12px 50px;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            background: transparent;
            color: white;
            border: 2px solid #a020f0;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #a020f0;
            box-shadow: 0 0 15px #a020f0;
        }
    </style>
</head>
<body>

    <h1>Maincraft Gradient 1.16+</h1>
    
    <a href="g.html" class="btn">ENTER</a>

</body>
</html>
