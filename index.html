<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Gradient</title>
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            /* Використовуємо шрифт Minecraftia */
            font-family: 'Minecraftia', sans-serif;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 40px;
            /* Градієнт: білий -> фіолетовий -> білий */
            background: linear-gradient(90deg, #ffffff 0%, #a020f0 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            background: transparent;
            color: white;
            border: 3px solid #a020f0;
            border-radius: 0px; /* Квадратна кнопка в стилі майна */
            text-decoration: none;
            transition: all 0.2s ease;
            font-family: 'Minecraftia', sans-serif;
        }

        .btn:hover {
            background-color: #a020f0;
            color: white;
            box-shadow: 0 0 10px #a020f0;
        }
    </style>
</head>
<body>

    <h1>Minecraft Gradient 1.16+</h1>
    
    <a href="g.html" class="btn">ENTER</a>

</body>
</html>
