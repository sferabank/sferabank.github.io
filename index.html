<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Selection</title>
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #121212;
            font-family: 'Minecraftia', sans-serif;
            color: white;
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 100%;
            max-width: 1000px; /* Немного расширил для длинного названия */
        }

        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: opacity 0.3s ease;
            text-decoration: none;
        }

        .title {
            font-size: 1.8rem;
            white-space: nowrap;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Градиенты для текста */
        .mc-color {
            background: linear-gradient(90deg, #ffffff, #a020f0);
            -webkit-background-clip: text;
        }

        .figma-color {
            background: linear-gradient(90deg, #ffffff, #8b5cf6);
            -webkit-background-clip: text;
        }

        /* Новый градиент для TellRaw */
        .tell-color {
            background: linear-gradient(90deg, #ffffff, #d946ef);
            -webkit-background-clip: text;
        }

        .dots {
            flex: 1;
            border-bottom: 3px dashed rgba(160, 32, 240, 0.3);
            margin: 0 20px;
            height: 10px;
        }

        .enter-btn {
            font-size: 1.5rem;
            color: #a020f0;
            border: 2px solid #a020f0;
            padding: 10px 30px;
            transition: all 0.2s ease;
        }

        .list-item:hover .enter-btn {
            background-color: #a020f0;
            color: white;
            box-shadow: 0 0 15px #a020f0;
        }

        /* Обновленная логика прозрачности для 3-х элементов */
        .list-container:has(.list-item:hover) .list-item:not(:hover) {
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="list-container">
        <a href="g.html" class="list-item">
            <span class="title mc-color">Minecraft Gradient 1.16+</span>
            <div class="dots"></div>
            <span class="enter-btn">[ ENTER ]</span>
        </a>

        <a href="tell.html" class="list-item">
            <span class="title tell-color">Minecraft TellRaw Generator</span>
            <div class="dots"></div>
            <span class="enter-btn">[ ENTER ]</span>
        </a>

        <a href="p.html" class="list-item">
            <span class="title figma-color">Figma Plugins Hub</span>
            <div class="dots"></div>
            <span class="enter-btn">[ ENTER ]</span>
        </a>
    </div>

</body>
</html>
