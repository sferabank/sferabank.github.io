<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Tellraw Generator</title>
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <style>
        :root {
            --primary: #a020f0;
            --primary-hover: #8b5cf6;
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Minecraftia', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-panel);
            padding: 30px;
            border: 3px solid var(--primary);
            box-shadow: 0 0 25px rgba(160, 32, 240, 0.3);
        }

        h1 {
            text-align: center;
            background: linear-gradient(90deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 2rem;
        }

        .input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        textarea#textInput {
            padding: 15px;
            background: var(--bg-dark);
            border: 2px solid #333;
            color: white;
            font-family: 'Minecraftia', sans-serif;
            outline: none;
            height: 120px;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea#textInput:focus {
            border-color: var(--primary);
        }

        .presets {
            margin-bottom: 20px;
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .preset-buttons button {
            background: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 5px 12px;
            font-family: 'Minecraftia', sans-serif;
            font-size: 0.7rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .preset-buttons button:hover {
            border-color: var(--primary);
            color: white;
        }

        .gradient-controls {
            background: var(--bg-dark);
            padding: 20px;
            border: 2px solid #333;
            margin-bottom: 20px;
        }

        .color-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-panel);
            padding: 8px;
            border: 1px solid var(--primary);
        }

        .color-item input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        .remove-btn {
            color: #ff4444;
            cursor: pointer;
            font-weight: bold;
            border: none;
            background: none;
            font-family: 'Minecraftia', sans-serif;
            font-size: 1rem;
        }

        .add-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Minecraftia', sans-serif;
            font-size: 0.75rem;
        }

        .add-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .style-row {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            align-items: center;
            background: var(--bg-dark);
            padding: 15px;
            border: 1px solid #333;
        }

        .style-row label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .preview-box {
            margin-top: 20px;
            padding: 25px;
            background: #000;
            border: 2px dashed var(--primary);
            min-height: 50px;
            font-size: 1.2rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
        }

        textarea#commandOutput {
            width: 100%;
            height: 130px;
            background: #000;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 15px;
            box-sizing: border-box;
            font-family: monospace;
            resize: none;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        .btn-copy {
            margin-top: 12px;
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            font-family: 'Minecraftia', sans-serif;
            cursor: pointer;
            transition: 0.2s;
            font-size: 1rem;
            text-transform: uppercase;
        }

        .btn-copy:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 20px rgba(160, 32, 240, 0.5);
        }

        .back-link {
            margin-top: 40px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Tellraw Generator</h1>

    <div class="input-group">
        <label>Message (Each line = new gradient):</label>
        <textarea id="textInput" placeholder="Welcome to my server!&#10;Visit our hub..." oninput="generate()"></textarea>
    </div>

    <div class="presets">
        <label>Presets:</label>
        <div class="preset-buttons">
            <button onclick="setPreset(['#ffffff', '#a020f0'])">Violet Dream</button>
            <button onclick="setPreset(['#ff5f6d', '#ffc371'])">Sunset</button>
            <button onclick="setPreset(['#00f2fe', '#4facfe'])">Ice Blue</button>
            <button onclick="setPreset(['#ff0000', '#00ff00', '#0000ff'])">RGB Classic</button>
            <button onclick="setPreset(['#fbda61', '#ff5acd'])">Candy</button>
        </div>
    </div>

    <div class="gradient-controls">
        <label>Colors (2-6):</label>
        <div id="colorList" class="color-list"></div>
        <button id="addBtn" class="add-btn" onclick="addColor()">+ ADD COLOR</button>
    </div>

    <div class="style-row">
        <label><input type="checkbox" id="bold" onchange="generate()"> BOLD</label>
        <label><input type="checkbox" id="italic" onchange="generate()"> ITALIC</label>
    </div>

    <label>Preview (In-game look):</label>
    <div class="preview-box" id="preview"></div>

    <div class="input-group" style="margin-top: 30px;">
        <label>JSON Command:</label>
        <textarea id="commandOutput" readonly></textarea>
        <button class="btn-copy" onclick="copyCommand()">COPY TO CLIPBOARD</button>
    </div>
</div>

<a href="index.html" class="back-link">← BACK TO HUB SELECTION</a>

<script>
    let colors = ["#ffffff", "#a020f0"];

    function setPreset(presetColors) {
        colors = [...presetColors];
        renderColors();
        generate();
    }

    function addColor() {
        if (colors.length < 6) {
            colors.push("#8b5cf6");
            renderColors();
            generate();
        }
    }

    function removeColor(index) {
        if (colors.length > 2) {
            colors.splice(index, 1);
            renderColors();
            generate();
        }
    }

    function updateColor(index, value) {
        colors[index] = value;
        generate();
    }

    function renderColors() {
        const container = document.getElementById('colorList');
        container.innerHTML = '';
        colors.forEach((color, i) => {
            const div = document.createElement('div');
            div.className = 'color-item';
            div.innerHTML = `
                <input type="color" value="${color}" oninput="updateColor(${i}, this.value)">
                ${colors.length > 2 ? `<button class="remove-btn" onclick="removeColor(${i})">×</button>` : ''}
            `;
            container.appendChild(div);
        });
        document.getElementById('addBtn').disabled = colors.length >= 6;
    }

    function hexToRgb(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);
        return { r, g, b };
    }

    function interpolateColor(color1, color2, factor) {
        const c1 = hexToRgb(color1);
        const c2 = hexToRgb(color2);
        const r = Math.round(c1.r + factor * (c2.r - c1.r));
        const g = Math.round(c1.g + factor * (c2.g - c1.g));
        const b = Math.round(c1.b + factor * (c2.b - c1.b));
        return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    function getMultiGradientColor(ratio) {
        if (ratio >= 1) return colors[colors.length - 1];
        const section = ratio * (colors.length - 1);
        const index = Math.floor(section);
        const factor = section - index;
        return interpolateColor(colors[index], colors[index + 1], factor);
    }

    function generate() {
        const text = document.getElementById('textInput').value || "Line 1\nLine 2";
        const isBold = document.getElementById('bold').checked;
        const isItalic = document.getElementById('italic').checked;
        const preview = document.getElementById('preview');
        const output = document.getElementById('commandOutput');

        preview.innerHTML = '';
        let tellrawParts = [""];
        const lines = text.split('\n');

        lines.forEach((line, lineIdx) => {
            for (let i = 0; i < line.length; i++) {
                const ratio = line.length > 1 ? i / (line.length - 1) : 0;
                const hex = getMultiGradientColor(ratio);

                const span = document.createElement('span');
                span.innerText = line[i];
                span.style.color = hex;
                if(isBold) span.style.fontWeight = "bold";
                if(isItalic) span.style.fontStyle = "italic";
                preview.appendChild(span);

                let part = {"text": line[i], "color": hex};
                if(isBold) part.bold = true;
                if(isItalic) part.italic = true;
                tellrawParts.push(part);
            }
            if (lineIdx < lines.length - 1) {
                preview.appendChild(document.createElement('br'));
                tellrawParts.push({"text": "\n"});
            }
        });

        output.value = `/tellraw @a ${JSON.stringify(tellrawParts)}`;
    }

    function copyCommand() {
        const copyText = document.getElementById("commandOutput");
        copyText.select();
        document.execCommand("copy");
        
        const originalText = document.querySelector('.btn-copy').innerText;
        document.querySelector('.btn-copy').innerText = "COPIED!";
        setTimeout(() => {
            document.querySelector('.btn-copy').innerText = originalText;
        }, 1500);
    }

    renderColors();
    generate();
</script>
</body>
</html>
