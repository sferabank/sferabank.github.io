<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Gradient Generator</title>
    <link href="https://fonts.cdnfonts.com/css/minecraftia" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        :root {
            --primary: #a020f0;
            --primary-glow: rgba(160, 32, 240, 0.4);
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Minecraftia', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--bg-panel);
            padding: 30px;
            border: 3px solid var(--primary);
            box-shadow: 0 0 25px var(--primary-glow);
        }

        h1 {
            text-align: center;
            background: linear-gradient(90deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            text-transform: uppercase;
            font-size: 1.8rem;
        }

        label {
            color: var(--primary);
            font-size: 0.8rem;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        input, textarea, select {
            width: 100%;
            background: var(--bg-dark);
            border: 2px solid #333;
            color: white;
            padding: 12px;
            font-family: 'Minecraftia', sans-serif;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
        }

        .row {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .flex-1 { flex: 1; min-width: 150px; }

        .gradient-controls {
            margin-top: 25px;
            padding: 20px;
            background: var(--bg-dark);
            border: 1px solid #333;
        }

        .color-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .color-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--bg-panel);
            padding: 5px;
            border: 1px solid var(--primary);
        }

        input[type="color"] {
            width: 35px;
            height: 35px;
            padding: 0;
            border: none;
            background: none;
            cursor: pointer;
        }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-family: 'Minecraftia', sans-serif;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .action-btn:hover {
            box-shadow: 0 0 15px var(--primary);
            background: #8b5cf6;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #ff4444;
            cursor: pointer;
            font-family: 'Minecraftia', sans-serif;
            font-size: 1.2rem;
        }

        .preview-box {
            margin: 25px 0;
            padding: 20px;
            background: #000;
            border: 2px dashed var(--primary);
            font-size: 1.4rem;
            text-align: center;
            word-break: break-all;
            min-height: 40px;
        }

        textarea#output {
            height: 100px;
            font-family: monospace;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .back-link {
            margin-top: 30px;
            color: #555;
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

<div class="container">
    <h1>Gradient Text Tool</h1>

    <label>Your Text:</label>
    <input type="text" id="text" value="Welcome to Hub" oninput="generate()">

    <div class="row">
        <div class="flex-1">
            <label>Prefix:</label>
            <select id="prefix" onchange="generate()">
                <option value="&">&</option>
                <option value="§">§</option>
            </select>
        </div>
        <div class="flex-1">
            <label>Style:</label>
            <select id="style" onchange="generate()">
                <option value="">NONE</option>
                <option value="l">BOLD</option>
                <option value="o">ITALIC</option>
                <option value="n">UNDERLINE</option>
            </select>
        </div>
        <div class="flex-1">
            <label>HEX Format:</label>
            <select id="hexMode" onchange="generate()">
                <option value="short">Plugin (&#rrggbb)</option>
                <option value="vanilla">Vanilla (&x)</option>
            </select>
        </div>
    </div>

    <div class="gradient-controls">
        <label>Colors:</label>
        <div id="colors" class="color-list"></div>
        <button class="action-btn" onclick="addColor()">+ Add Color</button>
    </div>

    <div class="preview-box" id="preview"></div>

    <label>Minecraft Code:</label>
    <textarea id="output" readonly></textarea>
    
    <div class="row">
        <button class="action-btn flex-1" style="padding: 15px;" onclick="copyText()">Copy Code</button>
    </div>
</div>

<a href="index.html" class="back-link">← Back to Hub</a>

<script>
    const colorsDiv = document.getElementById("colors");

    function addColor(val = "#ffffff") {
        if (colorsDiv.children.length >= 8) return;
        const row = document.createElement("div");
        row.className = "color-item";

        const input = document.createElement("input");
        input.type = "color";
        input.value = (colorsDiv.children.length === 0) ? "#ffffff" : (colorsDiv.children.length === 1 ? "#a020f0" : "#8b5cf6");
        input.addEventListener("input", generate);

        const btn = document.createElement("button");
        btn.innerHTML = "×";
        btn.className = "remove-btn";
        btn.onclick = () => {
            if (colorsDiv.children.length <= 2) return;
            row.remove();
            generate();
        };

        row.appendChild(input);
        row.appendChild(btn);
        colorsDiv.appendChild(row);
        generate();
    }

    function hexToRgb(h) {
        h = h.replace("#", "");
        return {
            r: parseInt(h.slice(0, 2), 16),
            g: parseInt(h.slice(2, 4), 16),
            b: parseInt(h.slice(4, 6), 16)
        };
    }

    function mix(a, b, t) {
        return {
            r: Math.round(a.r + (b.r - a.r) * t),
            g: Math.round(a.g + (b.g - a.g) * t),
            b: Math.round(a.b + (b.b - a.b) * t)
        };
    }

    function rgbToHex(c) {
        return "#" + [c.r, c.g, c.b].map(v => v.toString(16).padStart(2, "0")).join("");
    }

    function mcHex(prefix, hex) {
        const mode = document.getElementById("hexMode").value;
        const clean = hex.replace("#", "").toLowerCase();
        if (mode === "short") return prefix + "#" + clean;
        return prefix + "x" + clean.split("").map(c => prefix + c).join("");
    }

    function generate() {
        const text = document.getElementById("text").value;
        const prefix = document.getElementById("prefix").value;
        const style = document.getElementById("style").value;
        const cols = [...colorsDiv.querySelectorAll("input[type=color]")].map(c => c.value);
        const output = document.getElementById("output");
        const preview = document.getElementById("preview");

        if (cols.length < 2) return;
        
        let out = "", prev = "";
        for (let i = 0; i < text.length; i++) {
            const t = i / (text.length - 1 || 1);
            const idx = t * (cols.length - 1);
            const a = Math.floor(idx);
            const b = Math.min(a + 1, cols.length - 1);
            
            const hex = rgbToHex(mix(hexToRgb(cols[a]), hexToRgb(cols[b]), idx - a));
            
            out += mcHex(prefix, hex) + (style ? prefix + style : "") + text[i];
            prev += `<span style="color:${hex}; font-weight:${style==='l'?'bold':'normal'}; font-style:${style==='o'?'italic':'normal'}; text-decoration:${style==='n'?'underline':'none'}">${text[i]}</span>`;
        }
        output.value = out;
        preview.innerHTML = prev;
    }

    function copyText() {
        const out = document.getElementById("output");
        out.select();
        document.execCommand("copy");
    }

    // Init
    addColor();
    addColor();
</script>

</body>
</html>
